# Version updates as pull requests, so the pins in this repository (action
# commits, image digests, module versions) do not quietly age. Each PR runs
# the full CI, scans included, before anyone merges it.
version: 2
# One pull request for the third-party images in the manifests and in
# docker-compose. As two ecosystems they came as two PRs per image (Grafana
# #50 and #52, Prometheus #48 and #53); CI requires an image the two files
# share to be the same in both, so each PR alone failed and neither could be
# merged. Grouped, both files move in the same PR.
multi-ecosystem-groups:
  third-party-images:
    schedule:
      interval: weekly
updates:
  # The commit SHAs in .github/workflows; Dependabot rewrites the SHA and the
  # "# vX.Y.Z" comment next to it together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    # Minor and patch bumps in one weekly PR instead of one per action (the
    # first run opened five, all editing ci.yml, so each merge forced the
    # others to rebase and rerun CI). Majors stay separate: each can break
    # an input or a default and gets read before it is merged.
    groups:
      actions:
        update-types: [minor, patch]

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
    groups:
      # otel and its contrib instrumentation are released in lockstep
      # (contrib v0.69 requires otel v1.45); bumped one by one, every PR but
      # the last would fail to build.
      opentelemetry:
        patterns:
          - go.opentelemetry.io/*
      # Everything else that is not a major, in one PR. A module matches the
      # first group it fits, so otel stays in its own group above.
      go-modules:
        patterns:
          - "*"
        update-types: [minor, patch]

  # The two FROM lines: tag and digest move together. A golang bump must
  # also match go.mod's toolchain line, which CI checks.
  - package-ecosystem: docker
    directory: /deployments/docker
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    ignore:
      # Go stays on 1.26 (A4) until moving to a new minor is its own change:
      # go.mod's toolchain line has to move with the image, and CI rejects a
      # PR that bumps only the image (the first run proposed 1.27.2 that way).
      # Patch releases, which carry the security fixes, still come.
      - dependency-name: golang
        update-types: ["version-update:semver-minor", "version-update:semver-major"]

  # The third-party images in the Kubernetes manifests (NATS, Redis, Postgres,
  # Prometheus, Grafana). Majors are their own decision: Redis 8, Postgres 17,
  # Prometheus 3 and Grafana 12 each change behaviour or data formats.
  - package-ecosystem: docker
    # Every directory holding image references; GitHub's docs ask for one per
    # directory of Kubernetes manifests.
    directories:
      - /deployments/k8s/base
      - /deployments/k8s/monitoring
    patterns: ["*"]
    multi-ecosystem-group: third-party-images
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # The same images in docker-compose.yml, plus Jaeger and the collector; in
  # the same group as the manifests above.
  - package-ecosystem: docker-compose
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: third-party-images
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # The collector publishes per-architecture tags such as 0.162.0-386 next
      # to its multi-platform ones, and Dependabot took the suffix for a newer
      # version: it proposed a linux/386-only image (#51, then again in the
      # group PR #57) that would not start on amd64 or arm64. It runs in
      # docker-compose only, so it is upgraded by hand with the plain tag,
      # with the other monitoring images (finding #68).
      - dependency-name: otel/opentelemetry-collector-contrib
