name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Nightly, so a vulnerability published overnight turns main red the next
  # morning instead of first surfacing in whichever pull request comes next
  # (four past red runs came from the scans, two of them on docs-only PRs).
  # GitHub runs schedules on the default branch and mails failures to whoever
  # last edited this cron line; the odd minute avoids the top-of-hour load
  # that delays scheduled runs.
  schedule:
    - cron: "17 3 * * *" # 03:17 UTC
  # The same run on demand, e.g. to check a fix without waiting a night.
  workflow_dispatch:

# Least privilege: the token can only read the repository; a job that needs
# more (pushing images, A6) asks for it itself. The repository default is
# already read-only, but stating it here does not depend on that setting.
permissions:
  contents: read

# A new push to a pull request cancels its older run. Runs on main are never
# cancelled, only queued: cancelling one could stop a deploy halfway, since
# the deploy job runs in this workflow. The event is part of the group: a
# group holds one pending run and a newer one cancels it, so a nightly run
# sharing main's group could cancel a queued push and its deploy with it.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every action is pinned to a commit, with its release in the comment. A tag
# can be moved to other code at any time (tj-actions/changed-files, March 2025:
# its tags were repointed to a commit that dumped secrets into CI logs); a
# commit cannot. Dependabot proposes the bumps (.github/dependabot.yml).
# Every job has a time limit, a few times its usual duration. GitHub's default
# is 360 minutes: a job hung on a runner would hold it for six hours and, as
# runs on main queue instead of cancelling, delay every later push to main and
# its deploy as long. A slow runner is not cut short: one image build on main
# took 13 minutes instead of under 2 and still finished inside its 20.
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # CI tests and govulncheck audit go.mod's toolchain; the images are built
      # with the Dockerfile's golang tag. Dependabot bumps the two separately,
      # so a mismatch would ship binaries from a Go nobody audited.
      - name: Dockerfile Go matches go.mod toolchain
        run: |
          want=$(awk '$1 == "toolchain" { sub(/^go/, "", $2); print $2 }' go.mod)
          got=$(sed -nE 's/^FROM .*golang:([0-9.]+)-.*/\1/p' deployments/docker/Dockerfile)
          echo "go.mod toolchain: go${want:-<none>}, Dockerfile build stage: golang:${got:-<none>}"
          if [ -z "$want" ] || [ "$want" != "$got" ]; then
            echo "::error file=deployments/docker/Dockerfile::golang:${got} does not match go.mod's toolchain go${want}; bump both together"
            exit 1
          fi
      # docker-compose is where the stack is tested; deployments/k8s is what
      # runs. Dependabot bumps the two in separate PRs, so a third-party image
      # they share (NATS, Redis, Postgres, ...) must be the same tag@digest in
      # both, or what was tested is not what is deployed.
      - name: Shared images match between docker-compose and Kubernetes
        run: |
          k8s=$(grep -rhoE 'image: [^ ]+@sha256:[0-9a-f]{64}' deployments/k8s | cut -d' ' -f2 | sort -u)
          compose=$(grep -hoE 'image: [^ ]+@sha256:[0-9a-f]{64}' docker-compose.yml | cut -d' ' -f2 | sort -u)
          bad=0
          for ref in $k8s; do
            repo=${ref%%:*}
            other=$(printf '%s\n' "$compose" | grep -E "^${repo}:" || true)
            [ -z "$other" ] && continue
            if [ "$other" = "$ref" ]; then echo "same: ${ref%@*}"
            else echo "::error file=docker-compose.yml::$repo differs: deployments/k8s has ${ref%@*}, docker-compose.yml has ${other%@*} (or another digest)"; bad=1; fi
          done
          exit $bad
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Download modules
        run: go mod download
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Unit tests (race + coverage)
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./cmd/... ./internal/... ./pkg/...
      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1
      - name: Upload coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage.out

  integration:
    runs-on: ubuntu-latest # Docker is preinstalled; Testcontainers uses it
    timeout-minutes: 15
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Integration tests (Testcontainers)
        run: go test -tags integration -timeout 10m ./tests/integration/...

  services:
    # The image matrix comes from the cmd/ directories, so a new service is
    # built (and later published) without anyone remembering to list it here.
    # A hand-written list had drifted to 5 of the 7 services.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      list: ${{ steps.list.outputs.list }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: list
        run: |
          list=$(for d in cmd/*/; do basename "$d"; done | jq -Rcs 'split("\n") | map(select(length > 0))')
          echo "services: $list"
          echo "list=$list" >> "$GITHUB_OUTPUT"

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [lint, test, services]
    strategy:
      # Every service's build and scan runs to the end. With the default
      # (fail-fast: true) one failing image cancelled the jobs still running,
      # so their scan results never showed up.
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.services.outputs.list) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deployments/docker/Dockerfile
          build-args: |
            SERVICE=${{ matrix.service }}
            VERSION=${{ github.sha }}
          tags: gamemesh/${{ matrix.service }}:${{ github.sha }}
          # Build only: proves every image builds. Publishing to a registry
          # comes with the deploy pipeline (A6). Loaded into the runner's
          # Docker so the next step can scan it.
          push: false
          load: true
          # One cache scope per service. All seven used the default scope
          # ("buildkit"), and each build overwrites that scope's cache index,
          # so only the last job's cache survived.
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
      # The filesystem scan sees go.mod only; this one sees what ships: the
      # Alpine packages (musl, busybox, openssl) and the compiled binary.
      # TRIVY_EXIT_ON_EOL also fails a base image that no longer gets security
      # updates. Such an image can scan clean exactly because nobody files
      # fixes for it any more: alpine:3.20 reports 0 HIGH/CRITICAL, and only
      # this setting turns it red.
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_EXIT_ON_EOL: "1"
        with:
          scan-type: image
          image-ref: gamemesh/${{ matrix.service }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

  # The scans need nothing from the other jobs, so they start at once and run
  # in parallel, each in its own job: a failing scan can no longer stop the
  # next one from running (a govulncheck finding once stayed hidden behind a
  # red Trivy step in the same job).
  scan-deps:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Blocking since the manifests were reworked (A7): it found 33 HIGH issues
      # in deployments/k8s (no security context, writable root filesystem),
      # now 0. Runs first, so a red dependency scan cannot skip it.
      - name: Trivy misconfiguration scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: misconfig
          severity: HIGH,CRITICAL
          exit-code: "1"
          # Accepted findings, each scoped to one file and expiring.
          trivyignores: .trivyignore.yaml
      # The scanners are named: left empty, Trivy runs vuln and secret only, and
      # a step once called "deps + misconfig" never checked a single manifest.
      - name: Trivy dependency and secret scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

  # Every commit of the history, not only the tip: a key that was committed and
  # then deleted is still in the repository and still has to be rotated. Trivy's
  # secret scanner above sees only the checked-out files. GitHub's own secret
  # scanning and push protection cover pushes; this also covers what a pull
  # request brings in, with rules kept in the repository. The image is pinned
  # by digest; it marks every directory git-safe itself, so the runner's uid
  # owning the checkout is not a problem.
  # --verbose prints each finding's file, line, rule and commit (the value stays
  # REDACTED), so a red run says where to look; accepted false positives are
  # listed by fingerprint in .gitleaksignore.
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: gitleaks (full history)
        run: >-
          docker run --rm -v "$PWD":/repo:ro
          zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git --redact --verbose --no-banner --exit-code 1 /repo

  # The third-party images the manifests and docker-compose run (NATS, Redis,
  # Postgres, monitoring, tracing). The image scan above covers only the
  # images built here; these were never scanned, for vulnerabilities or for
  # an end-of-life base.
  third-party-images:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      list: ${{ steps.list.outputs.list }}
    env:
      # Report only, by name; every other image blocks, including one added
      # later. These are a major version behind and not deployed in phase 1
      # (monitoring stays out of production, A8; Jaeger and the collector run
      # in docker-compose only). Upgrading them is tracked as finding #68.
      REPORT_ONLY: prom/prometheus grafana/grafana jaegertracing/all-in-one otel/opentelemetry-collector-contrib
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: list
        run: |
          refs=$( (grep -rhoE 'image: [^ ]+@sha256:[0-9a-f]{64}' deployments/k8s; grep -hoE 'image: [^ ]+@sha256:[0-9a-f]{64}' docker-compose.yml) | cut -d' ' -f2 | sort -u)
          list=$(for ref in $refs; do
            repo=${ref%%:*}; blocking=true
            for r in $REPORT_ONLY; do [ "$r" = "$repo" ] && blocking=false; done
            jq -cn --arg image "$ref" --arg name "${ref%@*}" --argjson blocking "$blocking" '{image: $image, name: $name, blocking: $blocking}'
          done | jq -cs .)
          echo "$list" | jq -r '.[] | "\(if .blocking then "blocking   " else "report only" end)  \(.name)"'
          echo "list=$list" >> "$GITHUB_OUTPUT"

  scan-third-party:
    name: scan-third-party (${{ matrix.name }})
    needs: third-party-images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.third-party-images.outputs.list) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Same rules as the images built here (HIGH/CRITICAL with a fix, and
      # an end-of-life base fails), with the accepted findings in
      # .trivyignore.yaml: each scoped to a path or package, each expiring.
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_EXIT_ON_EOL: ${{ matrix.blocking && '1' || '0' }}
        with:
          scan-type: image
          image-ref: ${{ matrix.image }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: ${{ matrix.blocking && '1' || '0' }}
          trivyignores: .trivyignore.yaml

  # Renders both overlays and checks them against the Kubernetes API schemas,
  # on every pull request. It used to run only in the deploy job, on main, so
  # a broken manifest was found after the merge. Schema-valid is not working:
  # a reference to a Secret that does not exist passes (the local overlay had
  # one); k3d is where that shows.
  manifests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # A pinned release whose hash is checked before it runs: "latest" could
      # change under us, and a replaced release asset would run unchecked in
      # CI. The hash is the release's own CHECKSUMS entry,
      # recorded once, so a later swap of the file fails here. Bump both
      # together.
      # Custom resources (the prod overlay's Traefik Middleware) need their
      # own schemas: kubeconform only knows the built-in kinds, and an unknown
      # kind is an error under -strict. They come from the community
      # CRDs-catalog at a pinned commit, so the schemas cannot change under
      # us; -strict still rejects unknown fields and wrong types in them.
      - name: Validate Kubernetes manifests (kubeconform, offline schema check)
        env:
          KUBECONFORM_VERSION: v0.8.0
          KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
          CRDS_CATALOG: https://raw.githubusercontent.com/datreeio/CRDs-catalog/501527ab9c40c827144c8f45945b25a023e344ce
        run: |
          curl -fsSLo kubeconform.tar.gz "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  kubeconform.tar.gz" | sha256sum -c -
          tar xzf kubeconform.tar.gz kubeconform
          # The local overlay reads its secrets from a gitignored file; generate
          # throwaway values so it renders here too.
          scripts/k8s/local-secrets.sh
          # Against the Kubernetes version k3s runs, overlay by overlay.
          for overlay in local prod; do
            echo "== overlays/${overlay}"
            kubectl kustomize "deployments/k8s/overlays/${overlay}" | ./kubeconform -strict -summary -kubernetes-version 1.35.0 \
              -schema-location default \
              -schema-location "${CRDS_CATALOG}/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json" -
          done

  govulncheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # No checkout step: the action checks the repository out itself
      # (repo-checkout defaults to true).
      # govulncheck reports stdlib vulnerabilities against the toolchain it
      # runs on, so it audits exactly go.mod's toolchain, the one the images
      # are built with. When a new patch fixes a stdlib vulnerability this job
      # turns red: the shipped binaries really do contain it until the
      # toolchain line is bumped.
      - name: govulncheck
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          # The action defaults go-version-input to "stable", and setup-go
          # prefers go-version over go-version-file when both are set, so
          # without clearing it govulncheck audited the latest Go instead.
          go-version-input: ""
          go-version-file: go.mod

  # The one check the main branch ruleset requires. Listing every job there
  # instead would drift: the docker jobs are named after the cmd/ directories
  # ("docker (gateway)"), so a new service would not be required until someone
  # edited the ruleset. Every other job is listed here, in the same file.
  #
  # if: always() is the point of this job. A job skipped because something it
  # needs failed reports "Success" to required checks (GitHub's docs), so a
  # plain needs: would let a red scan merge. This job always runs and fails
  # itself unless every needed job succeeded. always() and not !cancelled():
  # a run cancelled by hand would skip it under !cancelled(), and a skipped
  # required check passes.
  ci-ok:
    if: always()
    needs: [lint, test, integration, services, docker, scan-deps, gitleaks, govulncheck, third-party-images, scan-third-party, manifests]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Every needed job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.value.result)\t\(.key)"'
          if ! echo "$NEEDS" | jq -e 'all(.[]; .result == "success")' > /dev/null; then
            echo "::error::Not every job succeeded; failure, cancelled and skipped all count as not passed"
            exit 1
          fi

  # Pushes every service's image to GHCR on a push to main, after every gate:
  # the registry only holds images that passed all of them. Both platforms,
  # so the VPS architecture (B1) stays open; arm64 costs little because the
  # build stage cross-compiles and the final stage runs nothing. The amd64
  # image is the one the docker job above built and scanned, with the same
  # build args, so its compile step comes from that job's cache scope.
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [ci-ok, services]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Job-level permissions replace the workflow's: contents: read is stated
    # again, and packages: write exists in this job only.
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.services.outputs.list) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deployments/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: |
            SERVICE=${{ matrix.service }}
            VERSION=${{ github.sha }}
          # The commit, never latest: one tag is one commit, and a rollback
          # deploys the previous SHA. Registry names must be lowercase, hence
          # the owner written out instead of github.repository_owner.
          tags: ghcr.io/alpnuhoglu/gamemesh-${{ matrix.service }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          push: true
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # Deploys this commit to production (plan D2): the images publish just
  # pushed, through the prod overlay, the way docs/deployment.md describes the
  # manual deploy. The cluster is reached over the tailnet with GitHub OIDC
  # tokens only (.github/actions/prod-cluster); what this identity may do is
  # decided in the cluster (ci-deployer Role, admission policy).
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Every gate, through the one job that checks them all, and the
    # published images the cluster will pull.
    needs: [ci-ok, publish]
    # A scheduled or manual run also has ref main; only a push deploys.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    # One deploy at a time, and never cancelled halfway: a newer push waits
    # for the running deploy instead of interrupting it.
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    permissions:
      contents: read
      # OIDC tokens for Tailscale and the Kubernetes API.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Reach the production cluster
        uses: ./.github/actions/prod-cluster
        with:
          ts-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          ts-audience: ${{ secrets.TS_AUDIENCE }}
          host: ${{ vars.K8S_HOST }}
          ca-data: ${{ vars.K8S_CA_DATA }}

      # Checks the images exist, applies after a server-side dry run, waits
      # for every workload and for https://api.gamemesh.app to serve this
      # commit; if any of that fails, redeploys the commit that ran before
      # (with its own manifests) and fails the job. See deploy.sh.
      - name: Deploy this commit
        uses: ./.github/actions/deploy
        with:
          sha: ${{ github.sha }}
