name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the token can only read the repository; a job that needs
# more (pushing images, A6) asks for it itself. The repository default is
# already read-only, but stating it here does not depend on that setting.
permissions:
  contents: read

# A new push to a pull request cancels its older run. Runs on main are never
# cancelled, only queued: cancelling one could stop a deploy halfway, since
# the deploy job runs in this workflow.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Download modules
        run: go mod download
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Unit tests (race + coverage)
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./cmd/... ./internal/... ./pkg/...
      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  integration:
    runs-on: ubuntu-latest # Docker is preinstalled; Testcontainers uses it
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Integration tests (Testcontainers)
        run: go test -tags integration -timeout 10m ./tests/integration/...

  services:
    # The image matrix comes from the cmd/ directories, so a new service is
    # built (and later published) without anyone remembering to list it here.
    # A hand-written list had drifted to 5 of the 7 services.
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.list.outputs.list }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: |
          list=$(for d in cmd/*/; do basename "$d"; done | jq -Rcs 'split("\n") | map(select(length > 0))')
          echo "services: $list"
          echo "list=$list" >> "$GITHUB_OUTPUT"

  docker:
    runs-on: ubuntu-latest
    needs: [lint, test, services]
    strategy:
      matrix:
        service: ${{ fromJSON(needs.services.outputs.list) }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployments/docker/Dockerfile
          build-args: |
            SERVICE=${{ matrix.service }}
            VERSION=${{ github.sha }}
          tags: gamemesh/${{ matrix.service }}:${{ github.sha }}
          # Build only: proves every image builds. Publishing to a registry
          # comes with the deploy pipeline (A6). Loaded into the runner's
          # Docker so the next step can scan it.
          push: false
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # The filesystem scan sees go.mod only; this one sees what ships: the
      # Alpine packages (musl, busybox, openssl) and the compiled binary.
      # TRIVY_EXIT_ON_EOL also fails a base image that no longer gets security
      # updates. Such an image can scan clean exactly because nobody files
      # fixes for it any more: alpine:3.20 reports 0 HIGH/CRITICAL, and only
      # this setting turns it red.
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_EXIT_ON_EOL: "1"
        with:
          scan-type: image
          image-ref: gamemesh/${{ matrix.service }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

  # The scans need nothing from the other jobs, so they start at once and run
  # in parallel, each in its own job: a failing scan can no longer stop the
  # next one from running (a govulncheck finding once stayed hidden behind a
  # red Trivy step in the same job).
  scan-deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Report only, until the manifests are reworked (A7): today it finds 33
      # HIGH issues, all in deployments/k8s (no securityContext, writable root
      # filesystem). Runs first so the blocking scan below cannot skip it.
      - name: Trivy misconfiguration scan (report only)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: misconfig
          severity: HIGH,CRITICAL
          exit-code: "0"
      # The scanners are named: left empty, Trivy runs vuln and secret only, and
      # a step once called "deps + misconfig" never checked a single manifest.
      - name: Trivy dependency and secret scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      # No checkout step: the action checks the repository out itself
      # (repo-checkout defaults to true).
      # govulncheck reports stdlib vulnerabilities against the toolchain it
      # runs on, so it audits exactly go.mod's toolchain, the one the images
      # are built with. When a new patch fixes a stdlib vulnerability this job
      # turns red: the shipped binaries really do contain it until the
      # toolchain line is bumped.
      - name: govulncheck
        uses: golang/govulncheck-action@v1
        with:
          # The action defaults go-version-input to "stable", and setup-go
          # prefers go-version over go-version-file when both are set, so
          # without clearing it govulncheck audited the latest Go instead.
          go-version-input: ""
          go-version-file: go.mod

  deploy:
    # Example deploy stage: validates the manifests and shows what a real
    # deploy job would run. Replace with `kubectl apply` against a real
    # cluster (credentials via OIDC or a KUBECONFIG secret).
    runs-on: ubuntu-latest
    # Every gate, and the images: needs is a data dependency, so docker must be
    # listed even though another job used to imply it.
    needs: [integration, docker, scan-deps, govulncheck]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Validate Kubernetes manifests (kubeconform, offline schema check)
        run: |
          curl -sL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz
          ./kubeconform -strict -summary deployments/k8s/
      - name: Deploy (example)
        run: |
          echo "Would run:"
          echo "  kubectl apply -f deployments/k8s/"
          echo "  kubectl -n gamemesh rollout status deploy/gateway"
