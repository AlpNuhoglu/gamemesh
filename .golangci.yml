run:
  timeout: 5m

linters:
  enable:
    - govet
    - staticcheck
    - errcheck
    - gosimple
    - ineffassign
    - unused
    - misspell
    - gosec
    - revive

linters-settings:
  gosec:
    excludes:
      - G104 # handled by errcheck

issues:
  exclude-rules:
    # Test files may ignore some strictness.
    - path: _test\.go
      linters: [gosec, errcheck]
