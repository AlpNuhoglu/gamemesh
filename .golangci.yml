version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - govet
    - staticcheck # includes the former gosimple
    - errcheck
    - ineffassign
    - unused
    - misspell
    - gosec
    - revive
  settings:
    gosec:
      excludes:
        - G104 # handled by errcheck
  exclusions:
    rules:
      # Test files may ignore some strictness.
      - path: _test\.go
        linters: [gosec, errcheck]
