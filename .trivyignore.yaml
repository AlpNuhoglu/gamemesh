  # Finding #88. Unlike gosu, nats-server runs: it is NATS itself, built with
  # go1.27.2, and no fixed release exists yet (2.15.1 is the latest). The flaw
  # is in certificate chain verification, which NATS only performs with TLS,
  # and ours has none: no TLS on clients, no cluster, leafnode or gateway
  # (measured on the running server via /varz: tls_required unset, 0
  # routes). Short expiry on purpose: Dependabot proposes the patched image
  # when it ships, and this entry goes with it. Invalid as soon as NATS gets
  # TLS.
  - id: CVE-2026-111943
    paths: ["usr/local/bin/nats-server"]
    statement: >-
      nats:2.15.1-alpine's nats-server is built with go1.27.2 (fixed in
      1.27.3). The vulnerable path is x509 chain verification, used only with
      TLS; this NATS has no TLS, cluster, leafnode or gateway.
    expired_at: 2026-11-04
  # Grafana 12.4.13 (phase 2, G5; finding #94): no Grafana release is free of
  # blocking findings (13.2.4 has 75), and 12.4 is 12.x's last minor,
  # supported until 2027-05-24. Short expiry: Grafana publishes a patch
  # release about every two weeks, and Dependabot proposes it; these go
  # with it. Revisit before the status page (G6) exposes Grafana at all.
  - id: CVE-2026-111943
    paths: ["usr/share/grafana/bin/grafana", "usr/share/grafana/bin/grafana-cli", "usr/share/grafana/bin/grafana-server"]
    statement: >-
      Grafana 12.4.13 is built with go1.26.9 (fixed in 1.26.10). The flaw is
      in x509 chain verification, used when Grafana is a TLS client; its
      settings (deployments/k8s/monitoring/grafana/grafana.ini) turn off
      every outbound connection, and it reaches Prometheus over plain HTTP.
    expired_at: 2026-11-10
  - id: CVE-2026-21728
    paths: ["usr/share/grafana/bin/grafana"]
    statement: >-
      Tempo's query code, compiled into Grafana for its Tempo data source.
      There is none (one provisioned data source, Prometheus; no one but the
      admin can add another).
    expired_at: 2026-11-10
  - id: CVE-2026-28377
    paths: ["usr/share/grafana/bin/grafana"]
    statement: >-
      Tempo's status config endpoint, compiled into Grafana for its Tempo data
      source. There is none, and Grafana serves no Tempo endpoint.
    expired_at: 2026-11-10
  - id: CVE-2026-100352
    paths: ["usr/share/grafana/bin/grafana"]
    statement: >-
      kin-openapi request decoding (denial of service). Reachability in
      Grafana is not verified; Grafana is cluster-internal until G6, whose
      Traefik route lets only the shared dashboard's paths through.
    expired_at: 2026-11-10
  - id: CVE-2026-100353
    paths: ["usr/share/grafana/bin/grafana"]
    statement: >-
      kin-openapi request decoding (denial of service). Reachability in
      Grafana is not verified; Grafana is cluster-internal until G6, whose
      Traefik route lets only the shared dashboard's paths through.
    expired_at: 2026-11-10
  - id: CVE-2026-100354
    paths: ["usr/share/grafana/bin/grafana"]
    statement: >-
      kin-openapi schema validation (denial of service). Reachability in
      Grafana is not verified; Grafana is cluster-internal until G6, whose
      Traefik route lets only the shared dashboard's paths through.
    expired_at: 2026-11-10
  - id: CVE-2026-111497
    purls: ["pkg:apk/alpine/brotli-libs@1.2.0-r1"]
    statement: >-
      Brotli's decoder in grafana/grafana:12.4.13's Alpine (fixed in
      1.2.1-r0), needed only by libcurl for the image's curl. Grafana's
      binaries are static and link neither; the probes are Kubernetes
      httpGet. curl runs in the publisher container only (G6,
      grafana/publish.sh), against Grafana on localhost and without
      --compressed, so it never decodes a compressed answer.
    expired_at: 2026-11-10
# Accepted misconfiguration findings, same rules: scoped to one file, with a
# reason and an expiry.
misconfigurations:
  - id: KSV-0056
    paths: ["deployments/k8s/cluster/ci-deployer.yaml"]
    statement: >-
      CI applies the prod overlay, which holds Services and an Ingress, so its
      Role must write them. What that write could be used for is refused in
      the API server instead (finding #87, gamemesh-admission-policy.yaml):
      in gamemesh a Service must be ClusterIP without externalIPs, and an
      Ingress must use class traefik and host api.gamemesh.app only.
    expired_at: 2027-04-21
