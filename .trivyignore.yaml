  # Grafana 12.4.14 (phase 2, G5; finding #94): its 12.4.13 exceptions for
  # Go's x509, kin-openapi and brotli went with the upgrade (fixed there);
  # these remain. 12.4 is 12.x's last minor, supported until 2027-05-24; 13.3.0
  # has 39 findings, mostly in bundled plugins. Short expiry: Grafana publishes
  # a patch release about every two weeks, and Dependabot proposes it.
  - id: CVE-2026-21728
    paths: ["usr/share/grafana/bin/grafana"]
    statement: >-
      Tempo's query code, compiled into Grafana for its Tempo data source.
      There is none (one provisioned data source, Prometheus; no one but the
      admin can add another).
    expired_at: 2026-11-24
  - id: CVE-2026-28377
    paths: ["usr/share/grafana/bin/grafana"]
    statement: >-
      Tempo's status config endpoint, compiled into Grafana for its Tempo data
      source. There is none, and Grafana serves no Tempo endpoint.
    expired_at: 2026-11-24
  - id: CVE-2026-116587
    paths: ["usr/share/grafana/bin/grafana"]
    statement: >-
      go-jose 4.1.4 (fixed in 4.1.6) parses RSA values from a JWK without
      bounds. Grafana reads JWKs for JWT and OAuth logins, both off here
      (deployments/k8s/monitoring/grafana/grafana.ini), and opens no outbound
      connection to fetch a key set; the status page routes only the shared
      dashboard's paths. Reasoned from configuration, not exercised.
    expired_at: 2026-11-24
  - id: CVE-2026-78661
    paths: ["usr/share/grafana/bin/grafana"]
    statement: >-
      golang.org/x/net 0.60.0 (fixed in 0.62.0; GO-2026-6860): quadratic time
      coalescing text nodes in x/net/html. Grafana compiles the package in,
      but not the vulnerable functions: govulncheck -mode=binary lists it at
      package level only, not among the symbols present. No newer 12.4 yet.
    expired_at: 2026-11-24
  # Prometheus 3.15.1 (phase 2, G4). 3.16.0 has the same finding (x/net
  # 0.61.0), so upgrading does not clear it.
  - id: CVE-2026-78661
    paths: ["usr/bin/prometheus", "usr/bin/promtool"]
    statement: >-
      golang.org/x/net 0.60.0 (fixed in 0.62.0; GO-2026-6860), in x/net/html.
      Neither binary contains the package: no x/net/html symbol in them, and
      govulncheck -mode=binary lists the module only. Expires after the next
      minor release, due about 2026-12-16.
    expired_at: 2026-12-16
  # postgres:16.15-alpine (2026-11-11): Alpine 3.24 has the fixed packages,
  # the official image not yet. Version-scoped, so the fixed packages are not
  # covered; on the next digest these hide nothing and can go.
  - id: CVE-2026-107364
    purls: ["pkg:apk/alpine/krb5-libs@1.22.2-r1"]
    statement: >-
      postgres:16.15-alpine has krb5-libs 1.22.2-r1 (fixed in 1.22.3-r0, in
      Alpine 3.24's repository but not yet in the official image, also not in
      its digest re-pushed on 2026-11-11). Most of these are in the KDC and
      kadmind, which the image does not contain; the server binary links
      libgssapi_krb5, and GSSAPI is not configured. Postgres is a ClusterIP
      Service, reachable only from inside the cluster. Scoped to this package
      version: the fixed one is not covered. Reasoned from the image's files,
      not exercised.
    expired_at: 2026-11-25
