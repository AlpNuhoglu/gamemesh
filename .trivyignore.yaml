# Accepted vulnerability findings, each scoped to where it was judged and
# each with an expiry: on expired_at the finding counts again and the scan
# turns red, so the decision is revisited instead of forgotten. Format:
# Trivy's .trivyignore.yaml (marked experimental in Trivy 0.70), chosen over
# the plain .trivyignore because it can scope an ID to a path or package:
# the gosu IDs are Go standard library CVEs, and ignoring them everywhere
# would also hide them in any other image.
vulnerabilities:
  - id: CVE-2025-61726
    paths: ["usr/local/bin/gosu"]
    statement: >-
      postgres:16.15-alpine ships gosu built with go1.24.6. Its entrypoint only
      runs gosu when started as root; the manifest starts it as uid 70, so the
      binary is never executed.
    expired_at: 2027-01-18
