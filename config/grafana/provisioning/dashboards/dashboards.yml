apiVersion: 1

providers:
  - name: GameMesh
    folder: GameMesh
    type: file
    options:
      path: /var/lib/grafana/dashboards
  # The status dashboard, from deployments/k8s/monitoring (the same file
  # Kubernetes provisions).
  - name: GameMesh status
    folder: GameMesh
    type: file
    allowUiUpdates: false
    disableDeletion: true
    options:
      path: /etc/grafana/dashboards
