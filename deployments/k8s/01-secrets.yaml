# DEV-ONLY values for Minikube. In a real cluster, create this Secret from a
# vault/CI pipeline instead of committing it:
#   kubectl -n gamemesh create secret generic gamemesh-secrets \
#     --from-literal=JWT_SECRET="$(openssl rand -hex 32)" \
#     --from-literal=POSTGRES_PASSWORD="$(openssl rand -hex 16)"
apiVersion: v1
kind: Secret
metadata:
  name: gamemesh-secrets
  namespace: gamemesh
type: Opaque
stringData:
  JWT_SECRET: minikube-dev-secret-change-me
  POSTGRES_USER: gamemesh
  POSTGRES_PASSWORD: gamemesh-dev-password
  POSTGRES_DB: gamemesh
