# Single-node PostgreSQL for Minikube. Production would use a managed
# database or an operator (CloudNativePG) with replication and backups.
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: gamemesh
data:
  01-schema.sql: |
    CREATE EXTENSION IF NOT EXISTS pgcrypto;

    CREATE TABLE IF NOT EXISTS players (
        id            UUID PRIMARY KEY DEFAULT gen_random_uuid(),
        username      VARCHAR(32)  NOT NULL,
        email         VARCHAR(255) NOT NULL,
        password_hash VARCHAR(255) NOT NULL,
        created_at    TIMESTAMPTZ  NOT NULL DEFAULT now(),
        updated_at    TIMESTAMPTZ  NOT NULL DEFAULT now(),
        CONSTRAINT uni_players_username UNIQUE (username),
        CONSTRAINT uni_players_email    UNIQUE (email),
        CONSTRAINT ck_players_username_len CHECK (char_length(username) >= 3)
    );

    CREATE TABLE IF NOT EXISTS player_stats (
        player_id    UUID PRIMARY KEY REFERENCES players (id) ON DELETE CASCADE,
        rank         INTEGER     NOT NULL DEFAULT 1000,
        score        BIGINT      NOT NULL DEFAULT 0,
        games_played INTEGER     NOT NULL DEFAULT 0,
        updated_at   TIMESTAMPTZ NOT NULL DEFAULT now(),
        CONSTRAINT ck_player_stats_rank  CHECK (rank >= 0),
        CONSTRAINT ck_player_stats_games CHECK (games_played >= 0)
    );

    CREATE INDEX IF NOT EXISTS idx_player_stats_rank ON player_stats (rank);
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: gamemesh
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: gamemesh
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: gamemesh-secrets
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "gamemesh"]
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 512Mi }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-data
        - name: init
          configMap:
            name: postgres-init
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: gamemesh
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
