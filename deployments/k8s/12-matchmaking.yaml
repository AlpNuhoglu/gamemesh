# NOTE: single replica by design — the match loop has no leader election yet.
# Scaling this horizontally requires a distributed lock around MatchOnce
# (e.g. Redis SET NX EX) or partitioning the queue by rank band.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: matchmaking
  namespace: gamemesh
spec:
  replicas: 1
  selector:
    matchLabels:
      app: matchmaking
  template:
    metadata:
      labels:
        app: matchmaking
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8082"
        prometheus.io/path: /metrics
    spec:
      # 30 s covers the worst case: preStop 5 s + HTTP shutdown 15 s
      # (pkg/server) + background workers 5 s (WorkerShutdownTimeout) = 25 s.
      terminationGracePeriodSeconds: 30
      containers:
        - name: matchmaking
          image: gamemesh/matchmaking:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8082
          env:
            - name: HTTP_PORT
              value: "8082"
          envFrom:
            - configMapRef:
                name: gamemesh-config
            - secretRef:
                name: gamemesh-secrets
          # Startup gives the process up to 60 s (30 x 2 s) before liveness counts,
          # so a slow start (Postgres retry, migrations) is not killed and restarted
          # in a loop; it replaces the old initialDelaySeconds guesses.
          startupProbe:
            httpGet: { path: /livez, port: 8082 }
            periodSeconds: 2
            failureThreshold: 30
          # Readiness is quick to drop a pod from the Service (4 s) when a
          # dependency fails; liveness is slow to kill it (30 s) and tolerates a
          # 3 s stall, since a 1 s timeout under a 500m CPU limit can fail on CFS
          # throttling alone and restart healthy pods under load.
          readinessProbe:
            httpGet: { path: /readyz, port: 8082 }
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 2
          livenessProbe:
            httpGet: { path: /livez, port: 8082 }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          # SIGTERM and the removal of this pod from the Service endpoints happen
          # in parallel; for these 5 s the pod keeps serving requests that were
          # routed to it before the endpoint update reached every node, instead of
          # refusing them (a 502 at the ingress). The kubelet's own sleep action:
          # no shell or sleep binary needed in the image.
          lifecycle:
            preStop:
              sleep: { seconds: 5 }
          resources:
            requests: { cpu: 100m, memory: 64Mi }
            limits: { cpu: 500m, memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: matchmaking
  namespace: gamemesh
spec:
  selector:
    app: matchmaking
  ports:
    - port: 8082
      targetPort: 8082
