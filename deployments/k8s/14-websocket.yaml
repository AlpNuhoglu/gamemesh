# Multiple WS replicas are safe: every replica subscribes to all events via
# Redis Pub/Sub, so a client connected to any replica receives every event.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: websocket
  namespace: gamemesh
spec:
  replicas: 2
  selector:
    matchLabels:
      app: websocket
  template:
    metadata:
      labels:
        app: websocket
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8084"
        prometheus.io/path: /metrics
    spec:
      containers:
        - name: websocket
          image: gamemesh/websocket:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8084
          env:
            - name: HTTP_PORT
              value: "8084"
          envFrom:
            - configMapRef:
                name: gamemesh-config
            - secretRef:
                name: gamemesh-secrets
          readinessProbe:
            httpGet: { path: /healthz, port: 8084 }
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 8084 }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: "1", memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: websocket
  namespace: gamemesh
spec:
  selector:
    app: websocket
  ports:
    - port: 8084
      targetPort: 8084
