apiVersion: apps/v1
kind: Deployment
metadata:
  name: outbox-relay
  namespace: gamemesh
spec:
  # Three replicas for HA. The relay claims rows with FOR UPDATE SKIP LOCKED
  # (internal/outbox/store.go), so replicas never publish the same outbox row —
  # running more than one removes the relay as a single point of failure between
  # persistence and event transport.
  replicas: 3
  selector:
    matchLabels:
      app: outbox-relay
  template:
    metadata:
      labels:
        app: outbox-relay
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8085"
        prometheus.io/path: /metrics
    spec:
      containers:
        - name: outbox-relay
          image: gamemesh/outbox-relay:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8085
          env:
            - name: HTTP_PORT
              value: "8085"
            - name: NATS_URL
              value: nats://nats:4222
            - name: OUTBOX_ENABLED
              value: "true"
            - name: OUTBOX_BATCH_SIZE
              value: "100"
            - name: OUTBOX_POLL_INTERVAL
              value: "1s"
            - name: OUTBOX_WORKERS
              value: "4"
            # Dead-letter a row after this many failed publish attempts
            # (0 = retry forever). Caps poison rows from wedging a worker.
            - name: OUTBOX_MAX_ATTEMPTS
              value: "5"
            - name: POSTGRES_DSN
              value: host=postgres user=$(POSTGRES_USER) password=$(POSTGRES_PASSWORD) dbname=$(POSTGRES_DB) port=5432 sslmode=disable
          envFrom:
            - configMapRef:
                name: gamemesh-config
            - secretRef:
                name: gamemesh-secrets
          # Startup gives the process up to 60 s (30 x 2 s) before liveness counts,
          # so a slow start (Postgres retry, migrations) is not killed and restarted
          # in a loop; it replaces the old initialDelaySeconds guesses.
          startupProbe:
            httpGet: { path: /livez, port: 8085 }
            periodSeconds: 2
            failureThreshold: 30
          # Readiness is quick to drop a pod from the Service (4 s) when a
          # dependency fails; liveness is slow to kill it (30 s) and tolerates a
          # 3 s stall, since a 1 s timeout under a 500m CPU limit can fail on CFS
          # throttling alone and restart healthy pods under load.
          readinessProbe:
            httpGet: { path: /readyz, port: 8085 }
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 2
          livenessProbe:
            httpGet: { path: /livez, port: 8085 }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests: { cpu: 100m, memory: 64Mi }
            limits: { cpu: 500m, memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: outbox-relay
  namespace: gamemesh
spec:
  selector:
    app: outbox-relay
  ports:
    - port: 8085
      targetPort: 8085
---
# Keep at least 2 relays running during voluntary disruptions (node drains,
# rollouts). Without this a cluster autoscaler or upgrade could evict all three
# replicas at once and stall outbox publishing until they reschedule.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: outbox-relay
  namespace: gamemesh
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: outbox-relay
