# The Presence Service is stateless: all presence lives in Redis keyed by
# playerID, so any replica can serve any read or update. No sticky sessions and
# no leader election — scale horizontally by raising replicas.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: presence
  namespace: gamemesh
spec:
  replicas: 2
  selector:
    matchLabels:
      app: presence
  template:
    metadata:
      labels:
        app: presence
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8086"
        prometheus.io/path: /metrics
    spec:
      containers:
        - name: presence
          image: gamemesh/presence:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8086
          env:
            - name: HTTP_PORT
              value: "8086"
          envFrom:
            - configMapRef:
                name: gamemesh-config
            - secretRef:
                name: gamemesh-secrets
          # Startup gives the process up to 60 s (30 x 2 s) before liveness counts,
          # so a slow start (Postgres retry, migrations) is not killed and restarted
          # in a loop; it replaces the old initialDelaySeconds guesses.
          startupProbe:
            httpGet: { path: /livez, port: 8086 }
            periodSeconds: 2
            failureThreshold: 30
          # Readiness is quick to drop a pod from the Service (4 s) when a
          # dependency fails; liveness is slow to kill it (30 s) and tolerates a
          # 3 s stall, since a 1 s timeout under a 500m CPU limit can fail on CFS
          # throttling alone and restart healthy pods under load.
          readinessProbe:
            httpGet: { path: /readyz, port: 8086 }
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 2
          livenessProbe:
            httpGet: { path: /livez, port: 8086 }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests: { cpu: 100m, memory: 64Mi }
            limits: { cpu: 500m, memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: presence
  namespace: gamemesh
spec:
  selector:
    app: presence
  ports:
    - port: 8086
      targetPort: 8086
