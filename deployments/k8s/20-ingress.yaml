# Requires the Minikube ingress addon: minikube addons enable ingress
# Add to /etc/hosts:  $(minikube ip)  gamemesh.local
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gamemesh
  namespace: gamemesh
  annotations:
    # WebSocket connections are long-lived; don't let nginx kill them.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  rules:
    - host: gamemesh.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  number: 8080
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: websocket
                port:
                  number: 8084
