# Minimal in-cluster Prometheus + Grafana for Minikube demos. A production
# cluster would use kube-prometheus-stack (Helm) instead.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: gamemesh
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: gamemesh-prometheus
rules:
  - apiGroups: [""]
    resources: [pods, services, endpoints]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: gamemesh-prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: gamemesh-prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: gamemesh
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: gamemesh
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
      evaluation_interval: 5s
    rule_files:
      - /etc/prometheus/alerts.yml
    scrape_configs:
      - job_name: gamemesh-pods
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [gamemesh]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - source_labels: [__meta_kubernetes_pod_label_app]
            target_label: app
  alerts.yml: |
    # Outbox relay alerting rules (mirror of config/prometheus/alerts.yml).
    groups:
      - name: outbox-relay
        rules:
          - alert: OutboxEventsDeadLettered
            expr: increase(gamemesh_outbox_events_dead_lettered_total[5m]) > 0
            for: 0m
            labels: { severity: critical, component: outbox-relay }
            annotations:
              summary: "Outbox rows dead-lettered (service {{ $labels.service }})"
              description: >
                {{ $value | printf "%.0f" }} outbox row(s) moved to FAILED in the
                last 5m. They will never publish without operator action.
          - alert: OutboxBacklogGrowing
            expr: gamemesh_outbox_events_pending > 500
            for: 10m
            labels: { severity: warning, component: outbox-relay }
            annotations:
              summary: "Outbox backlog growing (service {{ $labels.service }})"
              description: >
                {{ $value | printf "%.0f" }} PENDING rows for over 10m — relay
                behind or NATS unreachable. Events safe but delayed.
          - alert: OutboxPublishStalled
            expr: |
              rate(gamemesh_outbox_publish_failures_total[5m]) > 0
              and rate(gamemesh_outbox_events_published_total[5m]) == 0
            for: 5m
            labels: { severity: critical, component: outbox-relay }
            annotations:
              summary: "Outbox publishing stalled (service {{ $labels.service }})"
              description: >
                Publishes failing and none succeeding for 5m — NATS likely down.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: gamemesh
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: prometheus
      # Unlike the services, Prometheus needs its token: it discovers the pods
      # to scrape through the Kubernetes API (kubernetes_sd_configs).
      automountServiceAccountToken: true
      # The image's own user (nobody); fsGroup makes the volumes writable.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: prometheus
          image: prom/prometheus:v2.55.1@sha256:2659f4c2ebb718e7695cb9b25ffa7d6be64db013daba13e05c875451cf51b0d3
          args: ["--config.file=/etc/prometheus/prometheus.yml"]
          ports:
            - containerPort: 9090
          # Without probes a rollout reported success as soon as the container
          # started, before the server listened.
          startupProbe:
            httpGet: { path: /-/ready, port: 9090 }
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /-/ready, port: 9090 }
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          livenessProbe:
            httpGet: { path: /-/healthy, port: 9090 }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            # The TSDB (the image's VOLUME /prometheus, which Kubernetes
            # ignores). An emptyDir: metrics are lost with the pod, acceptable
            # while monitoring is not part of the production deployment.
            - name: data
              mountPath: /prometheus
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: gamemesh
spec:
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: gamemesh
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      automountServiceAccountToken: false
      # The image runs as uid 472 in the root group (gid 0); nothing it reads
      # needs that group, so it runs with its own. Strict keeps the kubelet
      # from adding the image's /etc/group memberships back: with the default
      # (Merge) the process still had root as a supplementary group.
      securityContext:
        runAsNonRoot: true
        runAsUser: 472
        runAsGroup: 472
        fsGroup: 472
        supplementalGroupsPolicy: Strict
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: grafana
          image: grafana/grafana:11.6.16@sha256:d67af92050b8d93b393dc741864752a69c9da1ffa39c1bb9af49ad5d9e47d2c3
          ports:
            - containerPort: 3000
          # Without probes a rollout reported success as soon as the container
          # started, before the server listened.
          startupProbe:
            httpGet: { path: /api/health, port: 3000 }
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /api/health, port: 3000 }
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          livenessProbe:
            httpGet: { path: /api/health, port: 3000 }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: admin
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: admin
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          # Grafana writes its database and plugins, its logs and temp files.
          volumeMounts:
            - name: data
              mountPath: /var/lib/grafana
            - name: logs
              mountPath: /var/log/grafana
            - name: tmp
              mountPath: /tmp
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
      volumes:
        - name: data
          emptyDir: {}
        - name: logs
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: gamemesh
spec:
  selector:
    app: grafana
  ports:
    - port: 3000
      targetPort: 3000
