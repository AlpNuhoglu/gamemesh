# Minimal in-cluster Prometheus + Grafana for Minikube demos. A production
# cluster would use kube-prometheus-stack (Helm) instead.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: gamemesh
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: gamemesh-prometheus
rules:
  - apiGroups: [""]
    resources: [pods, services, endpoints]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: gamemesh-prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: gamemesh-prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: gamemesh
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: gamemesh
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
      evaluation_interval: 5s
    rule_files:
      - /etc/prometheus/alerts.yml
    scrape_configs:
      - job_name: gamemesh-pods
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [gamemesh]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - source_labels: [__meta_kubernetes_pod_label_app]
            target_label: app
  alerts.yml: |
    # Outbox relay alerting rules (mirror of config/prometheus/alerts.yml).
    groups:
      - name: outbox-relay
        rules:
          - alert: OutboxEventsDeadLettered
            expr: increase(gamemesh_outbox_events_dead_lettered_total[5m]) > 0
            for: 0m
            labels: { severity: critical, component: outbox-relay }
            annotations:
              summary: "Outbox rows dead-lettered (service {{ $labels.service }})"
              description: >
                {{ $value | printf "%.0f" }} outbox row(s) moved to FAILED in the
                last 5m. They will never publish without operator action.
          - alert: OutboxBacklogGrowing
            expr: gamemesh_outbox_events_pending > 500
            for: 10m
            labels: { severity: warning, component: outbox-relay }
            annotations:
              summary: "Outbox backlog growing (service {{ $labels.service }})"
              description: >
                {{ $value | printf "%.0f" }} PENDING rows for over 10m — relay
                behind or NATS unreachable. Events safe but delayed.
          - alert: OutboxPublishStalled
            expr: |
              rate(gamemesh_outbox_publish_failures_total[5m]) > 0
              and rate(gamemesh_outbox_events_published_total[5m]) == 0
            for: 5m
            labels: { severity: critical, component: outbox-relay }
            annotations:
              summary: "Outbox publishing stalled (service {{ $labels.service }})"
              description: >
                Publishes failing and none succeeding for 5m — NATS likely down.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: gamemesh
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:v2.54.1
          args: ["--config.file=/etc/prometheus/prometheus.yml"]
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
      volumes:
        - name: config
          configMap:
            name: prometheus-config
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: gamemesh
spec:
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: gamemesh
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.2.0
          ports:
            - containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: admin
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: admin
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: gamemesh
spec:
  selector:
    app: grafana
  ports:
    - port: 3000
      targetPort: 3000
