apiVersion: apps/v1
kind: Deployment
metadata:
  name: outbox-relay
  namespace: gamemesh
  labels:
    app.kubernetes.io/name: outbox-relay
spec:
  # Three replicas for HA. The relay claims rows with FOR UPDATE SKIP LOCKED
  # (internal/outbox/store.go), so replicas never publish the same outbox row —
  # running more than one removes the relay as a single point of failure between
  # persistence and event transport.
  replicas: 3
  selector:
    matchLabels:
      app: outbox-relay
  template:
    metadata:
      labels:
        app: outbox-relay
        app.kubernetes.io/name: outbox-relay
        app.kubernetes.io/part-of: gamemesh
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8085"
        prometheus.io/path: /metrics
    spec:
      # Worst case before the kubelet sends SIGKILL: preStop 5 s + HTTP
      # shutdown 15 s (pkg/server) + background workers 5 s
      # (WorkerShutdownTimeout) + flushing traces 3 s (pkg/tracing) = 28 s.
      terminationGracePeriodSeconds: 35
      # The services never call the Kubernetes API; without a mounted token a
      # compromised pod cannot either.
      automountServiceAccountToken: false
      # Pod Security Standards "restricted". The image runs as 10001:10001
      # (numeric, so the kubelet can check runAsNonRoot); stated here as well
      # so the pod does not depend on what a future image declares.
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: outbox-relay
          image: gamemesh/outbox-relay:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8085
          env:
            - name: HTTP_PORT
              value: "8085"
            - name: NATS_URL
              value: nats://nats:4222
            - name: OUTBOX_ENABLED
              value: "true"
            - name: OUTBOX_BATCH_SIZE
              value: "100"
            - name: OUTBOX_POLL_INTERVAL
              value: "1s"
            - name: OUTBOX_WORKERS
              value: "4"
            # Dead-letter a row after this many failed publish attempts
            # (0 = retry forever). Caps poison rows from wedging a worker.
            - name: OUTBOX_MAX_ATTEMPTS
              value: "5"
            # connect_timeout bounds each connection attempt, as in
            # docker-compose: without it one attempt to a Postgres with no
            # endpoint hung for 39 s and used up database.Open's 30 s wait.
            - name: POSTGRES_DSN
              value: host=postgres user=$(POSTGRES_USER) password=$(POSTGRES_PASSWORD) dbname=$(POSTGRES_DB) port=5432 sslmode=disable connect_timeout=5
          envFrom:
            - configMapRef:
                name: gamemesh-config
            - secretRef:
                name: gamemesh-secrets
          # Startup gives the process up to 60 s (30 x 2 s) before liveness counts,
          # so a slow start (Postgres retry, migrations) is not killed and restarted
          # in a loop; it replaces the old initialDelaySeconds guesses.
          startupProbe:
            httpGet: { path: /livez, port: 8085 }
            periodSeconds: 2
            failureThreshold: 30
          # Readiness is quick to drop a pod from the Service (4 s) when a
          # dependency fails; liveness is slow to kill it (30 s) and tolerates a
          # 3 s stall, since a 1 s timeout under a 500m CPU limit can fail on CFS
          # throttling alone and restart healthy pods under load.
          readinessProbe:
            httpGet: { path: /readyz, port: 8085 }
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 2
          livenessProbe:
            httpGet: { path: /livez, port: 8085 }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          # SIGTERM and the removal of this pod from the Service endpoints happen
          # in parallel; for these 5 s the pod keeps serving requests that were
          # routed to it before the endpoint update reached every node, instead of
          # refusing them (a 502 at the ingress). The kubelet's own sleep action:
          # no shell or sleep binary needed in the image.
          lifecycle:
            preStop:
              sleep: { seconds: 5 }
          # The static binary writes nothing to disk, needs no privileges and no
          # capabilities: a compromised process cannot drop files into the image
          # or gain root through setuid.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 100m, memory: 64Mi }
            limits: { cpu: 500m, memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: outbox-relay
  namespace: gamemesh
  labels:
    app.kubernetes.io/name: outbox-relay
spec:
  selector:
    app: outbox-relay
  ports:
    - port: 8085
      targetPort: 8085
---
# Evict at most one relay at a time during voluntary disruptions (node drains,
# upgrades; a PDB does not govern rollouts). Without it a drain could evict
# every replica at once and stall outbox publishing until they reschedule.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: outbox-relay
  namespace: gamemesh
spec:
  # Not minAvailable: 2, which one replica (as in production) can never meet:
  # every drain then waits forever. maxUnavailable: 1 holds for any count.
  maxUnavailable: 1
  selector:
    matchLabels:
      app: outbox-relay
