# Single-node PostgreSQL. Production at scale: a managed database or an
# operator (CloudNativePG) with replication and backups.
#
# The schema comes from the player service's AutoMigrate (players,
# player_stats, outbox_events). The init SQL ConfigMap that used to sit here
# was a fourth copy of it, created only two of the three tables, and its
# constraint names differed from GORM's.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: gamemesh
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: gamemesh
  labels:
    app.kubernetes.io/name: postgres
spec:
  replicas: 1
  # Never two servers on the same data directory: the old pod stops before
  # the new one starts.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
        app.kubernetes.io/name: postgres
        app.kubernetes.io/part-of: gamemesh
    spec:
      automountServiceAccountToken: false
      # The image's postgres user (uid/gid 70) from the start; fsGroup makes
      # the volume writable for it.
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: postgres
          image: postgres:16.15-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: gamemesh-secrets
          env:
            # A subdirectory: initdb refuses a mount point that is not empty.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          # The user and database come from the Secret, not a name written
          # into the probe.
          startupProbe:
            exec:
              command: ["sh", "-c", 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            exec:
              command: ["sh", "-c", 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          livenessProbe:
            exec:
              command: ["sh", "-c", 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            # The only other places Postgres writes: its Unix socket and
            # temporary files.
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 512Mi }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-data
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: gamemesh
  labels:
    app.kubernetes.io/name: postgres
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
