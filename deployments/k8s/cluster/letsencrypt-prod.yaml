# Let's Encrypt production issuer (plan C3), added only after the staging
# issuer had issued a certificate for api.gamemesh.app. Production's limits
# are tight (failed validations and duplicate certificates per week), so the
# flow is tried on staging first and no separate test certificate is taken
# here: the first one comes from the Ingress (C4).
#
# Same as letsencrypt-staging.yaml apart from the directory and the account
# key. Replace ACME_EMAIL on the server (the repo is public).
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: ACME_EMAIL
    # The ACME account's private key, created on first use (in the
    # cert-manager namespace, encrypted at rest like every Secret).
    privateKeySecretRef:
      name: letsencrypt-prod-account
    solvers:
      # HTTP-01: cert-manager runs a short-lived solver pod and Ingress in
      # the Certificate's namespace, and Let's Encrypt fetches
      # http://<host>/.well-known/acme-challenge/<token> through Traefik.
      # Needs port 80 open and the name resolving to the server.
      - http01:
          ingress:
            ingressClassName: traefik
            # The solver's Service defaults to NodePort, which the gamemesh
            # namespace refuses (gamemesh-admission-policy.yaml, finding #87);
            # Traefik reaches a ClusterIP Service just as well.
            serviceType: ClusterIP
