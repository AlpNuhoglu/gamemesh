# Let's Encrypt staging issuer (plan C3). Staging's rate limits are far
# looser than production's and its certificates are not trusted by
# browsers: it proves the whole ACME flow before the production issuer
# exists, so a misconfiguration cannot burn production's failure limits.
#
# Cluster-level like cert-manager.yaml: copied into k3s's auto-deploy
# directory. Replace ACME_EMAIL on the server (the repo is public); the
# address only joins ISRG's announcement list, since Let's Encrypt no longer
# sends expiry emails (finding #85).
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: ACME_EMAIL
    # The ACME account's private key, created on first use (in the
    # cert-manager namespace, encrypted at rest like every Secret).
    privateKeySecretRef:
      name: letsencrypt-staging-account
    solvers:
      # HTTP-01: cert-manager runs a short-lived solver pod and Ingress in
      # the Certificate's namespace, and Let's Encrypt fetches
      # http://<host>/.well-known/acme-challenge/<token> through Traefik.
      # Needs port 80 open and the name resolving to the server.
      - http01:
          ingress:
            ingressClassName: traefik
