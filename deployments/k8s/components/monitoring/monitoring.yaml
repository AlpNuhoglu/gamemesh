# Grafana for the local k3d cluster, until phase 2's G5 moves it to the
# monitoring namespace with a release that passes CI's scan (finding #94).
# Prometheus moved there in G4 (deployments/k8s/monitoring).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: gamemesh
  labels:
    app.kubernetes.io/name: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
        app.kubernetes.io/name: grafana
        app.kubernetes.io/part-of: gamemesh
    spec:
      automountServiceAccountToken: false
      # The image runs as uid 472 in the root group (gid 0); nothing it reads
      # needs that group, so it runs with its own. Strict keeps the kubelet
      # from adding the image's /etc/group memberships back: with the default
      # (Merge) the process still had root as a supplementary group.
      securityContext:
        runAsNonRoot: true
        runAsUser: 472
        runAsGroup: 472
        fsGroup: 472
        supplementalGroupsPolicy: Strict
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: grafana
          image: grafana/grafana:11.6.16@sha256:d67af92050b8d93b393dc741864752a69c9da1ffa39c1bb9af49ad5d9e47d2c3
          ports:
            - containerPort: 3000
          # Without probes a rollout reported success as soon as the container
          # started, before the server listened.
          startupProbe:
            httpGet: { path: /api/health, port: 3000 }
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /api/health, port: 3000 }
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          livenessProbe:
            httpGet: { path: /api/health, port: 3000 }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: admin
            # From the overlay's Secret, not written here: with value admin
            # anyone who reached Grafana logged in as admin with admin/admin.
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: { name: gamemesh-secrets, key: GRAFANA_ADMIN_PASSWORD }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          # Grafana writes its database and plugins, its logs and temp files.
          volumeMounts:
            - name: data
              mountPath: /var/lib/grafana
            - name: logs
              mountPath: /var/log/grafana
            - name: tmp
              mountPath: /tmp
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
      volumes:
        - name: data
          emptyDir: {}
        - name: logs
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: gamemesh
  labels:
    app.kubernetes.io/name: grafana
spec:
  selector:
    app: grafana
  ports:
    - port: 3000
      targetPort: 3000
