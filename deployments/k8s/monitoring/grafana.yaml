# Grafana (phase 2, G5): one data source (Prometheus) and the status dashboard,
# both provisioned from grafana/ next to this file. Not exposed: its Service is
# ClusterIP and the namespace's admission policy refuses an Ingress; admins
# use kubectl port-forward. The admin password is in the grafana-admin Secret,
# created by the admin (docs/deployment.md, "Monitoring"); CI only names it.
#
# Its database (users, the public dashboard's settings in G6) lives on the
# volume, so a restart keeps them.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-data
  labels:
    app.kubernetes.io/name: grafana
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  labels:
    app.kubernetes.io/name: grafana
spec:
  replicas: 1
  # SQLite on the volume: one writer at a time.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
        app.kubernetes.io/name: grafana
        app.kubernetes.io/part-of: gamemesh
    spec:
      # Grafana calls no Kubernetes API.
      automountServiceAccountToken: false
      # The image runs as uid 472 in the root group (gid 0); nothing it reads
      # needs that group, so it runs with its own. Strict keeps the kubelet
      # from adding the image's /etc/group memberships back.
      securityContext:
        runAsNonRoot: true
        runAsUser: 472
        runAsGroup: 472
        fsGroup: 472
        supplementalGroupsPolicy: Strict
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: grafana
          image: grafana/grafana:12.4.13@sha256:41bbc1b5e04416f81891806076db2a2ff60a5d4da5f78d36a88b033a8c199185
          ports:
            - containerPort: 3000
          startupProbe:
            httpGet: { path: /api/health, port: 3000 }
            periodSeconds: 2
            # The first start migrates the database.
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /api/health, port: 3000 }
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          livenessProbe:
            httpGet: { path: /api/health, port: 3000 }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: admin
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: { name: grafana-admin, key: password }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - name: config
              mountPath: /etc/grafana/grafana.ini
              subPath: grafana.ini
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: dashboard-providers
              mountPath: /etc/grafana/provisioning/dashboards
            - name: dashboards
              mountPath: /etc/grafana/dashboards
            # Its database and plugins; logs and temporary files.
            - name: data
              mountPath: /var/lib/grafana
            - name: logs
              mountPath: /var/log/grafana
            - name: tmp
              mountPath: /tmp
          # Measured idle: 132 Mi (12.4.13, G5).
          resources:
            requests: { cpu: 100m, memory: 160Mi }
            limits: { cpu: 500m, memory: 384Mi }
      volumes:
        - name: config
          configMap:
            name: grafana-config
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: dashboard-providers
          configMap:
            name: grafana-dashboard-providers
        - name: dashboards
          configMap:
            name: grafana-dashboards
        - name: data
          persistentVolumeClaim:
            claimName: grafana-data
        - name: logs
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  labels:
    app.kubernetes.io/name: grafana
spec:
  selector:
    app: grafana
  ports:
    - port: 3000
      targetPort: 3000
