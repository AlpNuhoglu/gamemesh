# Grafana's settings (phase 2, G5), the same in docker-compose and Kubernetes.
# The admin user and password come from the environment (GF_SECURITY_*).
#
# Grafana makes no connection out of the cluster: no update or plugin checks,
# no usage reports, news feed or feedback links, no plugin catalog, signature
# key download or plugin preinstall, no external snapshots, no Gravatar. That
# is also why the x509 flaw in its Go (CVE-2026-111943, accepted in
# .trivyignore.yaml) is not reachable: it needs Grafana to verify a TLS
# server, and the only server it talks to is Prometheus, over plain HTTP.

[analytics]
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false
feedback_links_enabled = false

[news]
news_feed_enabled = false

[plugins]
plugin_admin_enabled = false
preinstall_disabled = true
public_key_retrieval_disabled = true

[snapshots]
external_enabled = false

[security]
disable_gravatar = true

[users]
allow_sign_up = false

# No anonymous access: the public status page (G6) is a shared dashboard,
# which needs no anonymous user at all.
[auth.anonymous]
enabled = false

# Every viewer's refresh is a query to Prometheus; 10 s matches its 15 s scrape
# closely enough and caps the load a browser can cause.
[dashboards]
min_refresh_interval = 10s
