# Monitoring in its own namespace (phase 2, G2/G4), for every cluster:
#
#   kubectl apply -k deployments/k8s/monitoring      (production: CI, after the app)
#
# What it needs first is cluster-level, written by the admin: the namespace
# (deployments/k8s/namespace/monitoring.yaml) and Prometheus's identity and
# rights (deployments/k8s/cluster/prometheus-rbac.yaml). CI may write what is
# here and nothing else in this namespace (deployments/k8s/cluster/ci-deployer.yaml).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
resources:
  - prometheus.yaml
configMapGenerator:
  - name: prometheus-config
    files:
      - prometheus.yml
