# Prometheus's configuration (phase 2, G4). Rendered into a ConfigMap by
# kustomization.yaml, whose name carries a hash of this file: a change here is
# a new pod template, so Prometheus restarts with it instead of keeping the
# old one.
global:
  # 15 s: rate(...[1m]) sees four samples per window, enough for panels
  # that move in near real time (G1).
  scrape_interval: 15s
  evaluation_interval: 15s
# No rule files: alerting is phase 3 (G8).
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
  # Pods that ask for it (prometheus.io/scrape and prometheus.io/port), in
  # gamemesh only: Prometheus may list pods there and nowhere else.
  - job_name: gamemesh-pods
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names: [gamemesh]
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        action: keep
        regex: "true"
      - source_labels: [__meta_kubernetes_pod_phase]
        action: drop
        regex: Pending|Succeeded|Failed
      - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
        action: replace
        regex: ([^:]+)(?::\d+)?;(\d+)
        replacement: $1:$2
        target_label: __address__
      - source_labels: [__meta_kubernetes_namespace]
        target_label: namespace
      - source_labels: [__meta_kubernetes_pod_label_app]
        target_label: app
  # The node's disk (phase 3 prep, G4): nothing watched it, and images had
  # filled 45 % of it. The kubelet's cAdvisor endpoint reports every container
  # of the node, some 3,700 series; only the node's own filesystems are kept
  # (the root cgroup, id="/", on a real block device), about four series, so
  # watching the disk does not fill it. Once a minute is plenty for a disk.
  #
  # Needs the ClusterRole in deployments/k8s/cluster/prometheus-rbac.yaml
  # (nodes, nodes/metrics), which CI does not apply: without it this target
  # is down and nothing else changes.
  - job_name: node-disk
    scrape_interval: 60s
    scheme: https
    metrics_path: /metrics/cadvisor
    kubernetes_sd_configs:
      - role: node
    tls_config:
      ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    authorization:
      credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
    metric_relabel_configs:
      - source_labels: [__name__, id, device]
        action: keep
        regex: container_fs_(usage|limit)_bytes;/;/dev/(vd|sd|xvd|nvme|mmcblk).*
