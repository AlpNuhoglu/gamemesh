# Production on the VPS (single-node k3s).
#
#   kubectl apply -k deployments/k8s/overlays/prod     (only from CI, step D)
#
# No Secret is generated here: the cluster must already hold gamemesh-secrets,
# created there and never committed (docs/deployment.md, "Production
# secrets"), with these keys:
#   JWT_SECRET, POSTGRES_PASSWORD, REDIS_PASSWORD   openssl rand -hex 32 each
#   POSTGRES_USER, POSTGRES_DB                      gamemesh
# The services refuse to start in production when one they use is missing,
# shorter than 32 characters or a known default (config.Validate), so a
# missing or weak Secret stalls the rollout instead of running. Monitoring
# stays out (finding #68).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: gamemesh
resources:
  - ../../base
  - redirect-https.yaml
# The images CI published, at the commit being deployed: the deploy job sets
# the tag with kustomize edit set image <name>=...:<sha> before applying
# (step D). The value here is a deliberate placeholder: an apply by hand pulls
# nothing and fails visibly instead of quietly running some older image.
images:
  - name: gamemesh/gateway
    newName: ghcr.io/alpnuhoglu/gamemesh-gateway
    newTag: set-by-deploy
  - name: gamemesh/player
    newName: ghcr.io/alpnuhoglu/gamemesh-player
    newTag: set-by-deploy
  - name: gamemesh/matchmaking
    newName: ghcr.io/alpnuhoglu/gamemesh-matchmaking
    newTag: set-by-deploy
  - name: gamemesh/leaderboard
    newName: ghcr.io/alpnuhoglu/gamemesh-leaderboard
    newTag: set-by-deploy
  - name: gamemesh/websocket
    newName: ghcr.io/alpnuhoglu/gamemesh-websocket
    newTag: set-by-deploy
  - name: gamemesh/outbox-relay
    newName: ghcr.io/alpnuhoglu/gamemesh-outbox-relay
    newTag: set-by-deploy
  - name: gamemesh/presence
    newName: ghcr.io/alpnuhoglu/gamemesh-presence
    newTag: set-by-deploy
# One replica each. On a single node a second replica adds no availability
# (the node is the failure domain) and costs memory; the outbox-relay
# PodDisruptionBudget (maxUnavailable: 1) still lets a drain through.
replicas:
  - name: gateway
    count: 1
  - name: player
    count: 1
  - name: leaderboard
    count: 1
  - name: websocket
    count: 1
  - name: outbox-relay
    count: 1
  - name: presence
    count: 1
patches:
  # Traefik's pods are the gateway's only direct clients (k3s's default pod
  # CIDR); see finding #52.
  - target:
      kind: Deployment
      name: gateway
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: TRUSTED_PROXIES
          value: 10.42.0.0/16
  # D3 TEST, reverted right after: a deliberately broken release. A value in
  # env overrides the one from envFrom (the Secret), so the gateway gets a
  # JWT_SECRET shorter than 32 characters and config.Validate refuses to
  # start it. The deploy job must turn red, roll back to the previous
  # commit, and production must keep serving throughout.
  - target:
      kind: Deployment
      name: gateway
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: JWT_SECRET
          value: d3-test-too-short
  # The public API name (C1). Its DNS record is an A record only, without
  # the Cloudflare proxy: the cluster is IPv4-only (finding #81), and a proxy
  # would end TLS at Cloudflare and hide the client's address from the
  # gateway. .app is HSTS-preloaded, so browsers use HTTPS only.
  - target:
      kind: Ingress
      name: gamemesh
    patch: |-
      - op: add
        path: /spec/rules/0/host
        value: api.gamemesh.app
  # TLS (C4): cert-manager sees the issuer annotation and the tls section and
  # keeps a Certificate for the host in the api-tls Secret, renewed before it
  # expires. ECDSA P-256: a smaller certificate and handshake than the RSA
  # 2048 default. Plain HTTP on these routes is redirected (redirect-https.yaml;
  # Traefik names CRD middlewares <namespace>-<name>@kubernetescrd).
  - target:
      kind: Ingress
      name: gamemesh
    patch: |-
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: gamemesh
        annotations:
          cert-manager.io/cluster-issuer: letsencrypt-prod
          cert-manager.io/private-key-algorithm: ECDSA
          cert-manager.io/private-key-size: "256"
          traefik.ingress.kubernetes.io/router.middlewares: gamemesh-redirect-https@kubernetescrd
      spec:
        tls:
          - hosts:
              - api.gamemesh.app
            secretName: api-tls
