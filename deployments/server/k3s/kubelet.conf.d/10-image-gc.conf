# When the kubelet removes images no container uses (docs/deployment.md,
# "Image garbage collection"). Every deploy pulls eight new images, and with
# the kubelet's defaults (start at 85 % disk, stop at 80 %, no age limit) the
# old ones stayed: 17.7 GiB of images, 45 % of the disk, after three weeks.
#
# On the server this file goes to
# /var/lib/rancher/k3s/agent/etc/kubelet.conf.d/10-image-gc.conf (k3s 1.32+
# reads that directory; its own settings are 00-k3s-defaults.conf, and a
# later file wins). The kubelet reads it at start: restart k3s after a change.
apiVersion: kubelet.config.k8s.io/v1beta1
kind: KubeletConfiguration
# An image unused for a week goes, however empty the disk is. A week of
# releases stays on the node; a rollback further back pulls its images again.
# The kubelet does not remember use across its own restart, so after one the
# week starts over. This setting has no command-line flag, which is why all
# three are here and not in config.yaml's kubelet-arg.
imageMaximumGCAge: 168h
# If the disk still reaches 60 %, collect down to 50 %: before the disk
# check's 70 % warning instead of after it.
imageGCHighThresholdPercent: 60
imageGCLowThresholdPercent: 50
