# GameMesh production server SSH policy (plan B2).
# Install as /etc/ssh/sshd_config.d/10-gamemesh.conf, then `sshd -t` and
# `sshd -T` before reloading. For most keywords sshd keeps the FIRST value it
# reads. Ubuntu's sshd_config includes this directory at its top, so this file
# wins over the lines below that Include, including the ones the provider's
# installer appended.

# Keys only, for one named admin user; root logs in through sudo.
PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
AuthenticationMethods publickey
AllowUsers alp

# Fewer chances per connection and a shorter window to authenticate.
MaxAuthTries 3
LoginGraceTime 30

# Nothing on this server needs a display or the client's agent. Local port
# forwarding stays for debugging (e.g. `ssh -L` to a cluster service).
X11Forwarding no
AllowAgentForwarding no
AllowTcpForwarding local
