# GameMesh full local stack: `docker compose up --build` starts everything.
# Secrets come from .env (copy .env.example); every variable has a dev
# default so the stack also boots with no .env present.

x-service-env: &service-env
  APP_ENV: ${APP_ENV:-development}
  JWT_SECRET: ${JWT_SECRET:-insecure-dev-secret-do-not-use-in-prod}
  JWT_EXPIRY: ${JWT_EXPIRY:-24h}
  JWT_ISSUER: ${JWT_ISSUER:-gamemesh}
  REDIS_ADDR: redis:6379
  REDIS_PASSWORD: ${REDIS_PASSWORD:-}
  ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-*}
  # Event transport. Redis stays the system of record (sessions, queue,
  # leaderboard, room cache); NATS JetStream carries inter-service events with
  # durability, replay and at-least-once delivery. Set EVENT_BUS=redis to fall
  # back to the original Pub/Sub transport — no code change, just config.
  EVENT_BUS: ${EVENT_BUS:-nats}
  NATS_URL: ${NATS_URL:-nats://nats:4222}
  EVENT_WORKERS: ${EVENT_WORKERS:-8}
  # Distributed tracing: every service ships spans to the OTel Collector, which
  # forwards them to Jaeger. Set OTEL_ENABLED=false to turn tracing off entirely.
  OTEL_ENABLED: ${OTEL_ENABLED:-true}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-otel-collector:4317}
  OTEL_TRACES_SAMPLER: ${OTEL_TRACES_SAMPLER:-parentbased_always_on}
  OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-1.0}
  SERVICE_VERSION: ${SERVICE_VERSION:-dev}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gamemesh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gamemesh-dev-password}
      POSTGRES_DB: ${POSTGRES_DB:-gamemesh}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Schema + seed run automatically on first boot.
      - ./scripts/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./scripts/db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gamemesh}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # NATS with JetStream enabled (-js): the durable event transport. Streams are
  # created idempotently by the services on boot. Storage is persisted to a
  # volume so events (and consumer cursors) survive container restarts —
  # enabling replay and at-least-once redelivery. :8222 serves the monitoring
  # endpoint used for the healthcheck.
  nats:
    image: nats:2.10-alpine
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports:
      - "4222:4222" # client
      - "8222:8222" # monitoring
    volumes:
      - natsdata:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  gateway:
    build:
      context: .
      dockerfile: deployments/docker/Dockerfile.gateway
    environment:
      <<: *service-env
      HTTP_PORT: "8080"
      PLAYER_SERVICE_URL: http://player:8081
      MATCHMAKING_SERVICE_URL: http://matchmaking:8082
      LEADERBOARD_SERVICE_URL: http://leaderboard:8083
      WEBSOCKET_SERVICE_URL: http://websocket:8084
      RATE_LIMIT_RPS: ${RATE_LIMIT_RPS:-50}
      RATE_LIMIT_BURST: ${RATE_LIMIT_BURST:-100}
    ports:
      - "8080:8080"
    depends_on:
      player:
        condition: service_healthy
      matchmaking:
        condition: service_healthy
      leaderboard:
        condition: service_healthy
      websocket:
        condition: service_healthy
    healthcheck: &svc-healthcheck
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  player:
    build:
      context: .
      dockerfile: deployments/docker/Dockerfile.player
    environment:
      <<: *service-env
      HTTP_PORT: "8081"
      POSTGRES_DSN: host=postgres user=${POSTGRES_USER:-gamemesh} password=${POSTGRES_PASSWORD:-gamemesh-dev-password} dbname=${POSTGRES_DB:-gamemesh} port=5432 sslmode=disable
      AUTO_MIGRATE: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      otel-collector:
        condition: service_started
    healthcheck:
      <<: *svc-healthcheck
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/healthz"]

  matchmaking:
    build:
      context: .
      dockerfile: deployments/docker/Dockerfile.matchmaking
    environment:
      <<: *service-env
      HTTP_PORT: "8082"
      MATCH_INTERVAL_SECONDS: ${MATCH_INTERVAL_SECONDS:-5}
      MATCH_RANK_WINDOW: ${MATCH_RANK_WINDOW:-100}
      MATCH_BATCH_SIZE: ${MATCH_BATCH_SIZE:-1000}
      MATCH_MAX_QUEUE_AGE: ${MATCH_MAX_QUEUE_AGE:-5m}
      ROOM_TTL: ${ROOM_TTL:-1h}
      REDIS_POOL_SIZE: ${REDIS_POOL_SIZE:-0}
    depends_on:
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
      otel-collector:
        condition: service_started
    healthcheck:
      <<: *svc-healthcheck
      test: ["CMD", "wget", "-qO-", "http://localhost:8082/healthz"]

  leaderboard:
    build:
      context: .
      dockerfile: deployments/docker/Dockerfile.leaderboard
    environment:
      <<: *service-env
      HTTP_PORT: "8083"
    depends_on:
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
      otel-collector:
        condition: service_started
    healthcheck:
      <<: *svc-healthcheck
      test: ["CMD", "wget", "-qO-", "http://localhost:8083/healthz"]

  websocket:
    build:
      context: .
      dockerfile: deployments/docker/Dockerfile.websocket
    environment:
      <<: *service-env
      HTTP_PORT: "8084"
      # Feed presence over HTTP; the heartbeat interval also paces the WS replica's
      # presence-refresh ticker.
      PRESENCE_SERVICE_URL: http://presence:8086
      PRESENCE_HEARTBEAT_INTERVAL: ${PRESENCE_HEARTBEAT_INTERVAL:-15s}
    ports:
      - "8084:8084"
    depends_on:
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
      otel-collector:
        condition: service_started
    healthcheck:
      <<: *svc-healthcheck
      test: ["CMD", "wget", "-qO-", "http://localhost:8084/healthz"]

  # Presence Service: tracks player presence (online/in-queue/in-match/away) in
  # Redis with TTL-based self-healing and publishes presence transitions to NATS.
  # Stateless and horizontally scalable — all state is in Redis keyed by playerID.
  presence:
    build:
      context: .
      dockerfile: deployments/docker/Dockerfile.presence
    environment:
      <<: *service-env
      HTTP_PORT: "8086"
      PRESENCE_TTL: ${PRESENCE_TTL:-45s}
      PRESENCE_HEARTBEAT_INTERVAL: ${PRESENCE_HEARTBEAT_INTERVAL:-15s}
    ports:
      - "8086:8086"
    depends_on:
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
      otel-collector:
        condition: service_started
    healthcheck:
      <<: *svc-healthcheck
      test: ["CMD", "wget", "-qO-", "http://localhost:8086/healthz"]

  # Transactional outbox relay: the publish side of the outbox pattern. It polls
  # outbox_events (written by the player service in the same Postgres transaction
  # as the business state) and publishes committed rows to NATS JetStream. A
  # dedicated process so it scales/restarts independently of the player API and
  # keeps the player service free of any NATS dependency.
  outbox-relay:
    build:
      context: .
      dockerfile: deployments/docker/Dockerfile.outbox-relay
    environment:
      <<: *service-env
      HTTP_PORT: "8085"
      POSTGRES_DSN: host=postgres user=${POSTGRES_USER:-gamemesh} password=${POSTGRES_PASSWORD:-gamemesh-dev-password} dbname=${POSTGRES_DB:-gamemesh} port=5432 sslmode=disable
      OUTBOX_ENABLED: ${OUTBOX_ENABLED:-true}
      OUTBOX_BATCH_SIZE: ${OUTBOX_BATCH_SIZE:-100}
      OUTBOX_POLL_INTERVAL: ${OUTBOX_POLL_INTERVAL:-1s}
      OUTBOX_WORKERS: ${OUTBOX_WORKERS:-4}
      # Dead-letter a row after this many failed publish attempts (0 = retry
      # forever). 5 lets transient NATS blips self-heal but caps poison rows.
      OUTBOX_MAX_ATTEMPTS: ${OUTBOX_MAX_ATTEMPTS:-5}
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      otel-collector:
        condition: service_started
    healthcheck:
      <<: *svc-healthcheck
      test: ["CMD", "wget", "-qO-", "http://localhost:8085/healthz"]

  # Jaeger all-in-one: receives OTLP directly (v1.35+) and serves the trace UI
  # on :16686. In-memory storage — fine for local dev; swap for Badger/ES in prod.
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686" # Jaeger UI
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:16686/"]
      interval: 5s
      timeout: 3s
      retries: 10

  # OpenTelemetry Collector: a single buffering/routing hop in front of Jaeger.
  # Services export here (OTLP/gRPC :4317); the collector batches and forwards to
  # Jaeger. Keeping the backend behind the collector means Jaeger can be swapped
  # for Tempo/Datadog by editing config/otel/collector.yaml — no service rebuilds.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    command: ["--config=/etc/otel/collector.yaml"]
    volumes:
      - ./config/otel/collector.yaml:/etc/otel/collector.yaml:ro
    ports:
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
    depends_on:
      jaeger:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.54.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    volumes:
      # Mount the whole dir so prometheus.yml and alerts.yml are both available.
      - ./config/prometheus:/etc/prometheus:ro
    depends_on:
      - gateway

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    ports:
      - "3000:3000"
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./config/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  pgdata:
  natsdata:
