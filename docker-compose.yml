# GameMesh full local stack: `docker compose up --build` starts everything.
# Secrets come from .env (copy .env.example); every variable has a dev
# default so the stack also boots with no .env present.
#
# Published ports bind to 127.0.0.1 only. Containers reach each other by
# service name on the compose network, so host ports exist only for local
# tools; binding them to 0.0.0.0 would expose the dev databases and the
# unauthenticated internal APIs (e.g. presence) to the whole LAN.
#
# Every service uses `restart: always`, the closest match to Kubernetes, which
# keeps the declared state running: the stack comes back after a crash, an OOM
# kill or a Docker Desktop restart. Quitting Docker Desktop marks containers as
# manually stopped, so `unless-stopped` would not bring them back. To stop the
# stack on purpose, use `docker compose down` (the counterpart of scaling to
# zero), not `stop`. A crash loop stays visible as "Restarting" in `docker
# compose ps` and as a rising RestartCount.

# One definition for the Redis password: the server's --requirepass, its
# healthcheck and every client below all read this value.
x-redis-password: &redis-password ${REDIS_PASSWORD:-gamemesh-dev-redis-password}

x-service-env: &service-env
  APP_ENV: ${APP_ENV:-development}
  JWT_SECRET: ${JWT_SECRET:-insecure-dev-secret-do-not-use-in-prod}
  JWT_EXPIRY: ${JWT_EXPIRY:-24h}
  JWT_ISSUER: ${JWT_ISSUER:-gamemesh}
  REDIS_ADDR: redis:6379
  REDIS_PASSWORD: *redis-password
  ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-*}
  # Empty = trust no proxy's X-Forwarded-For; the gateway is the edge here.
  TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
  # Event transport. Redis stays the system of record (sessions, queue,
  # leaderboard, room cache); NATS JetStream carries inter-service events with
  # durability, replay and at-least-once delivery. Set EVENT_BUS=redis to fall
  # back to the original Pub/Sub transport — no code change, just config.
  EVENT_BUS: ${EVENT_BUS:-nats}
  NATS_URL: ${NATS_URL:-nats://nats:4222}
  EVENT_WORKERS: ${EVENT_WORKERS:-8}
  # Distributed tracing: every service ships spans to the OTel Collector, which
  # forwards them to Jaeger. Set OTEL_ENABLED=false to turn tracing off entirely.
  OTEL_ENABLED: ${OTEL_ENABLED:-true}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-otel-collector:4317}
  OTEL_TRACES_SAMPLER: ${OTEL_TRACES_SAMPLER:-parentbased_always_on}
  OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-1.0}

services:
  postgres:
    restart: always
    image: postgres:16.15-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gamemesh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gamemesh-dev-password}
      POSTGRES_DB: ${POSTGRES_DB:-gamemesh}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Schema + seed run automatically on first boot.
      - ./scripts/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./scripts/db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gamemesh}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    restart: always
    image: redis:7.4.11-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    # The first argument must stay redis-server: the image's entrypoint only
    # drops root for that command.
    command: ["redis-server", "--requirepass", *redis-password]
    environment:
      # redis-cli inside the container (healthcheck, `docker compose exec
      # redis redis-cli ...`) authenticates with this.
      REDISCLI_AUTH: *redis-password
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  # NATS with JetStream enabled (-js): the durable event transport. Streams are
  # created idempotently by the services on boot. Storage is persisted to a
  # volume so events (and consumer cursors) survive container restarts —
  # enabling replay and at-least-once redelivery. :8222 serves the monitoring
  # endpoint used for the healthcheck.
  nats:
    restart: always
    image: nats:2.15.1-alpine@sha256:2ae57dfba3063d5e25fecb75256118c0882a1a2d2cf7d0fba17a7c701df956f6
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports:
      - "127.0.0.1:4222:4222" # client
      - "127.0.0.1:8222:8222" # monitoring
    volumes:
      - natsdata:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  gateway:
    restart: always
    build:
      context: .
      dockerfile: deployments/docker/Dockerfile
      args:
        SERVICE: gateway
        VERSION: ${VERSION:-dev}
    environment:
      <<: *service-env
      HTTP_PORT: "8080"
      PLAYER_SERVICE_URL: http://player:8081
      MATCHMAKING_SERVICE_URL: http://matchmaking:8082
      LEADERBOARD_SERVICE_URL: http://leaderboard:8083
      WEBSOCKET_SERVICE_URL: http://websocket:8084
      RATE_LIMIT_RPS: ${RATE_LIMIT_RPS:-50}
      RATE_LIMIT_BURST: ${RATE_LIMIT_BURST:-100}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      player:
        condition: service_healthy
      matchmaking:
        condition: service_healthy
      leaderboard:
        condition: service_healthy
      websocket:
        condition: service_healthy
    # App healthchecks hit /readyz, so `docker compose ps` shows a service
    # whose dependency is down as unhealthy and depends_on waits for real
    # readiness. Docker never restarts an unhealthy container; only k8s
    # liveness (/livez) does that.
    healthcheck: &svc-healthcheck
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/readyz"]
      interval: 5s
      timeout: 3s
      retries: 10

  player:
    restart: always
    build:
      context: .
      dockerfile: deployments/docker/Dockerfile
      args:
        SERVICE: player
        VERSION: ${VERSION:-dev}
    environment:
      <<: *service-env
      HTTP_PORT: "8081"
      POSTGRES_DSN: host=postgres user=${POSTGRES_USER:-gamemesh} password=${POSTGRES_PASSWORD:-gamemesh-dev-password} dbname=${POSTGRES_DB:-gamemesh} port=5432 sslmode=disable connect_timeout=5
      AUTO_MIGRATE: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      otel-collector:
        condition: service_started
    healthcheck:
      <<: *svc-healthcheck
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/readyz"]

  matchmaking:
    restart: always
    build:
      context: .
      dockerfile: deployments/docker/Dockerfile
      args:
        SERVICE: matchmaking
        VERSION: ${VERSION:-dev}
    environment:
      <<: *service-env
      HTTP_PORT: "8082"
      MATCH_INTERVAL_SECONDS: ${MATCH_INTERVAL_SECONDS:-5}
      MATCH_RANK_WINDOW: ${MATCH_RANK_WINDOW:-100}
      MATCH_BATCH_SIZE: ${MATCH_BATCH_SIZE:-1000}
      MATCH_MAX_QUEUE_AGE: ${MATCH_MAX_QUEUE_AGE:-5m}
      ROOM_TTL: ${ROOM_TTL:-1h}
      REDIS_POOL_SIZE: ${REDIS_POOL_SIZE:-0}
    depends_on:
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
      otel-collector:
        condition: service_started
    healthcheck:
      <<: *svc-healthcheck
      test: ["CMD", "wget", "-qO-", "http://localhost:8082/readyz"]

  leaderboard:
    restart: always
    build:
      context: .
      dockerfile: deployments/docker/Dockerfile
      args:
        SERVICE: leaderboard
        VERSION: ${VERSION:-dev}
    environment:
      <<: *service-env
      HTTP_PORT: "8083"
    depends_on:
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
      otel-collector:
        condition: service_started
    healthcheck:
      <<: *svc-healthcheck
      test: ["CMD", "wget", "-qO-", "http://localhost:8083/readyz"]

  websocket:
    restart: always
    build:
      context: .
      dockerfile: deployments/docker/Dockerfile
      args:
        SERVICE: websocket
        VERSION: ${VERSION:-dev}
    environment:
      <<: *service-env
      HTTP_PORT: "8084"
      # Feed presence over HTTP; the heartbeat interval also paces the WS replica's
      # presence-refresh ticker.
      PRESENCE_SERVICE_URL: http://presence:8086
      PRESENCE_HEARTBEAT_INTERVAL: ${PRESENCE_HEARTBEAT_INTERVAL:-15s}
    ports:
      - "127.0.0.1:8084:8084"
    depends_on:
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
      otel-collector:
        condition: service_started
    healthcheck:
      <<: *svc-healthcheck
      test: ["CMD", "wget", "-qO-", "http://localhost:8084/readyz"]

  # Presence Service: tracks player presence (online/in-queue/in-match/away) in
  # Redis with TTL-based self-healing and publishes presence transitions to NATS.
  # Stateless and horizontally scalable — all state is in Redis keyed by playerID.
  presence:
    restart: always
    build:
      context: .
      dockerfile: deployments/docker/Dockerfile
      args:
        SERVICE: presence
        VERSION: ${VERSION:-dev}
    environment:
      <<: *service-env
      HTTP_PORT: "8086"
      PRESENCE_TTL: ${PRESENCE_TTL:-45s}
      PRESENCE_HEARTBEAT_INTERVAL: ${PRESENCE_HEARTBEAT_INTERVAL:-15s}
    ports:
      - "127.0.0.1:8086:8086"
    depends_on:
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
      otel-collector:
        condition: service_started
    healthcheck:
      <<: *svc-healthcheck
      test: ["CMD", "wget", "-qO-", "http://localhost:8086/readyz"]

  # Transactional outbox relay: the publish side of the outbox pattern. It polls
  # outbox_events (written by the player service in the same Postgres transaction
  # as the business state) and publishes committed rows to NATS JetStream. A
  # dedicated process so it scales/restarts independently of the player API and
  # keeps the player service free of any NATS dependency.
  outbox-relay:
    restart: always
    build:
      context: .
      dockerfile: deployments/docker/Dockerfile
      args:
        SERVICE: outbox-relay
        VERSION: ${VERSION:-dev}
    environment:
      <<: *service-env
      HTTP_PORT: "8085"
      POSTGRES_DSN: host=postgres user=${POSTGRES_USER:-gamemesh} password=${POSTGRES_PASSWORD:-gamemesh-dev-password} dbname=${POSTGRES_DB:-gamemesh} port=5432 sslmode=disable connect_timeout=5
      OUTBOX_ENABLED: ${OUTBOX_ENABLED:-true}
      OUTBOX_BATCH_SIZE: ${OUTBOX_BATCH_SIZE:-100}
      OUTBOX_POLL_INTERVAL: ${OUTBOX_POLL_INTERVAL:-1s}
      OUTBOX_WORKERS: ${OUTBOX_WORKERS:-4}
      # Dead-letter a row after this many failed publish attempts (0 = retry
      # forever). 5 lets transient NATS blips self-heal but caps poison rows.
      OUTBOX_MAX_ATTEMPTS: ${OUTBOX_MAX_ATTEMPTS:-5}
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      otel-collector:
        condition: service_started
    healthcheck:
      <<: *svc-healthcheck
      test: ["CMD", "wget", "-qO-", "http://localhost:8085/readyz"]

  # Jaeger all-in-one: receives OTLP directly (v1.35+) and serves the trace UI
  # on :16686. In-memory storage — fine for local dev; swap for Badger/ES in prod.
  jaeger:
    restart: always
    image: jaegertracing/all-in-one:1.62.0@sha256:836e9b69c88afbedf7683ea7162e179de63b1f981662e83f5ebb68badadc710f
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "127.0.0.1:16686:16686" # Jaeger UI
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:16686/"]
      interval: 5s
      timeout: 3s
      retries: 10

  # OpenTelemetry Collector: a single buffering/routing hop in front of Jaeger.
  # Services export here (OTLP/gRPC :4317); the collector batches and forwards to
  # Jaeger. Keeping the backend behind the collector means Jaeger can be swapped
  # for Tempo/Datadog by editing config/otel/collector.yaml — no service rebuilds.
  otel-collector:
    restart: always
    image: otel/opentelemetry-collector-contrib:0.111.0@sha256:a2a52e43c1a80aa94120ad78c2db68780eb90e6d11c8db5b3ce2f6a0cc6b5029
    command: ["--config=/etc/otel/collector.yaml"]
    volumes:
      - ./config/otel/collector.yaml:/etc/otel/collector.yaml:ro
    ports:
      - "127.0.0.1:4317:4317" # OTLP gRPC
      - "127.0.0.1:4318:4318" # OTLP HTTP
    depends_on:
      jaeger:
        condition: service_healthy

  prometheus:
    restart: always
    image: prom/prometheus:v2.54.1@sha256:f6639335d34a77d9d9db382b92eeb7fc00934be8eae81dbc03b31cfe90411a94
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      # Mount the whole dir so prometheus.yml and alerts.yml are both available.
      - ./config/prometheus:/etc/prometheus:ro
    depends_on:
      - gateway

  grafana:
    restart: always
    image: grafana/grafana:11.6.16@sha256:d67af92050b8d93b393dc741864752a69c9da1ffa39c1bb9af49ad5d9e47d2c3
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./config/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  pgdata:
  natsdata:
